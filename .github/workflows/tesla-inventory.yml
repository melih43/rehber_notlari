name: Tesla inventory check

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Önceki çalıştırmanın durumunu (görülen ilanlar) geri yükle.
      - name: Restore state
        uses: actions/cache@v4
        with:
          path: tools/tesla-bot/state.json
          key: tesla-state-${{ github.run_id }}
          restore-keys: |
            tesla-state-

      - name: Run bot
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: php tools/tesla-bot/bot.php
